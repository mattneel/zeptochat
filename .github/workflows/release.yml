name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-linux
          - os: macos-13
            arch: x86_64
            target: x86_64-macos
          - os: macos-latest
            arch: aarch64
            target: aarch64-macos
          - os: windows-latest
            arch: x86_64
            target: x86_64-windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Run tests
        run: zig build test -Doptimize=ReleaseFast

      - name: Build all binaries
        run: zig build install-all -Doptimize=ReleaseFast

      - name: Verify build output (Unix)
        if: runner.os != 'Windows'
        run: ls -lR zig-out/bin

      - name: Verify build output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem -Recurse zig-out\bin

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ ! -d zig-out ]; then
            echo "ERROR: zig-out directory not found. Build failed."
            exit 1
          fi
          cd zig-out
          tar czf ../zamn-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *
          cd ..

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path zig-out)) {
            Write-Error "ERROR: zig-out directory not found. Build failed."
            exit 1
          }
          cd zig-out
          Compress-Archive -Path * -DestinationPath ../zamn-${{ github.ref_name }}-${{ matrix.target }}.zip
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zamn-${{ matrix.target }}
          path: |
            zamn-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            zamn-${{ github.ref_name }}-${{ matrix.target }}.zip

  create-release:
    name: Create Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}