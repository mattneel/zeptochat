[tools]
zig = "0.15.1"
act = "latest"
mdbook = "latest"

[env]
# CUDA support (when we add it)
# CUDA_HOME = "/usr/local/cuda"
# LD_LIBRARY_PATH = "/usr/local/cuda/lib64:${LD_LIBRARY_PATH}"

[tasks.fmt]
description = "Check formatting"
run = "zig fmt --check ."

[tasks."fmt:fix"]
description = "Fix formatting"
run = "zig fmt ."

[tasks.test]
description = "Run all tests"
run = "zig build test --summary all"

[tasks."test:opt"]
description = "Run tests optimized"
run = "zig build test --summary all -Doptimize=ReleaseFast"

[tasks.tokenize]
description = "Tokenize text with Zeptochat CLI (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
zig build -Doptimize=ReleaseFast run -- tokenize "$@"
"""

[tasks.train]
description = "Train TinyConfig model (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
zig build -Doptimize=ReleaseFast run -- train "$@"
"""

[tasks.generate]
description = "Generate text from checkpoint (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
zig build -Doptimize=ReleaseFast run -- generate "$@"
"""

[tasks.bench]
description = "Run benchmarks"
run = "zig build bench -Doptimize=ReleaseFast"
run_windows = "zig build bench -Doptimize=ReleaseFast"


[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf zig-out zig-cache .zig-cache"
run_windows = "if exist zig-out rmdir /s /q zig-out && if exist zig-cache rmdir /s /q zig-cache && if exist .zig-cache rmdir /s /q .zig-cache"

[tasks.docs]
description = "Build documentation"
run = "mdbook build docs --dest-dir ../zig-out/docs"

[tasks."docs:serve"]
description = "Serve docs locally"
run = "mdbook serve docs --open"

[tasks."docs:watch"]
description = "Watch and rebuild docs"
run = "mdbook watch docs"

[tasks.ci]
description = "Run all CI checks"
run = "mise run fmt && mise run test && mise run test:opt"

[tasks."ci:local"]
description = "Test CI with act"
run = "act pull_request"

[tasks."ci:job"]
description = "Test specific CI job with act"
run = "act pull_request -j $1"

[tasks.hooks]
description = "Install git hooks"
run = """
#!/usr/bin/env bash
mkdir -p .git/hooks
cat > .git/hooks/pre-commit << 'EOF'
#!/bin/sh
mise run ci
EOF
chmod +x .git/hooks/pre-commit
echo "✅ Git hooks installed"
"""
run_windows = """
if not exist .git\\hooks mkdir .git\\hooks
echo mise run ci > .git\\hooks\\pre-commit
echo ✅ Git hooks installed
"""
