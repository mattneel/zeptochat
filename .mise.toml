[tools]
zig = "0.15.1"
act = "latest"
mdbook = "latest"

[env]
# CUDA support (when we add it)
# CUDA_HOME = "/usr/local/cuda"
# LD_LIBRARY_PATH = "/usr/local/cuda/lib64:${LD_LIBRARY_PATH}"

[tasks.fmt]
description = "Check formatting"
run = "zig fmt --check ."

[tasks."fmt:fix"]
description = "Fix formatting"
run = "zig fmt ."

[tasks.test]
description = "Run all tests"
run = "zig build test --summary all"

[tasks."test:opt"]
description = "Run tests optimized"
run = "zig build test --summary all -Doptimize=ReleaseFast"

[tasks.tokenize]
description = "Tokenize text with Zeptochat CLI (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
zig build -Doptimize=ReleaseFast run -- tokenize "$@"
"""

[tasks.train]
description = "Train TinyConfig model (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
zig build -Doptimize=ReleaseFast run -- train "$@"
"""

[tasks.generate]
description = "Generate text from checkpoint (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
zig build -Doptimize=ReleaseFast run -- generate "$@"
"""

[tasks."tinystories:prepare"]
description = "Download TinyStories and create 50k-line subset"
run = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p data
SOURCE_PATH="data/TinyStoriesV2-GPT4-train.txt"
SUBSET_PATH="data/tinystories_50k.txt"
URL="https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt"

if [ ! -f "$SOURCE_PATH" ]; then
  echo "Downloading TinyStories dataset..."
  if command -v curl >/dev/null 2>&1; then
    curl -L "$URL" -o "$SOURCE_PATH"
  elif command -v wget >/dev/null 2>&1; then
    wget -O "$SOURCE_PATH" "$URL"
  else
    echo "Error: need curl or wget to download TinyStories" >&2
    exit 1
  fi
else
  echo "TinyStories dataset already present at $SOURCE_PATH"
fi

echo "Writing 50k-line subset to $SUBSET_PATH"
head -n 50000 "$SOURCE_PATH" > "$SUBSET_PATH"
echo "Done. Subset size: $(wc -l < "$SUBSET_PATH") lines"
"""

[tasks."tinystories:tokenize"]
description = "Tokenize TinyStories subset with Zeptochat CLI (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
zig build -Doptimize=ReleaseFast run -- tokenize data/tinystories_50k.txt data/tinystories_50k.tokens --tokenizer-dir tests/fixtures/gpt2_mini
"""

[tasks."tinystories:train"]
description = "Train TinyConfig model on TinyStories subset (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
zig build -Doptimize=ReleaseFast run -- train data/tinystories_50k.tokens --epochs 10 --seq-len 32 --learning-rate 0.0005 --save-every 1 --checkpoint-dir checkpoints --batch-size 4
"""

[tasks."tinystories:train-fast"]
description = "Train TinyConfig model on TinyStories subset with larger batches (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
zig build -Doptimize=ReleaseFast run -- train data/tinystories_50k.tokens --config configs/train_fast.json
"""

[tasks."tinystories:chat"]
description = "Chat with TinyStories checkpoint (ReleaseFast)"
run = """
#!/usr/bin/env bash
set -euo pipefail
CHECKPOINT="${1:-checkpoints/model_epoch1.ckpt}"
PROMPT="${2:-Once upon a time}"
MAX_TOKENS="${3:-128}"
TEMPERATURE="${4:-0.8}"
zig build -Doptimize=ReleaseFast run -- generate "$CHECKPOINT" "$PROMPT" --tokenizer-dir tests/fixtures/gpt2_mini --max-tokens "$MAX_TOKENS" --temperature "$TEMPERATURE"
"""

[tasks.bench]
description = "Run benchmarks"
run = "zig build bench -Doptimize=ReleaseFast"
run_windows = "zig build bench -Doptimize=ReleaseFast"


[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf zig-out zig-cache .zig-cache"
run_windows = "if exist zig-out rmdir /s /q zig-out && if exist zig-cache rmdir /s /q zig-cache && if exist .zig-cache rmdir /s /q .zig-cache"

[tasks.docs]
description = "Build documentation"
run = "mdbook build docs --dest-dir ../zig-out/docs"

[tasks."docs:serve"]
description = "Serve docs locally"
run = "mdbook serve docs --open"

[tasks."docs:watch"]
description = "Watch and rebuild docs"
run = "mdbook watch docs"

[tasks.ci]
description = "Run all CI checks"
run = "mise run fmt && mise run test && mise run test:opt"

[tasks."ci:local"]
description = "Test CI with act"
run = "act pull_request"

[tasks."ci:job"]
description = "Test specific CI job with act"
run = "act pull_request -j $1"

[tasks.hooks]
description = "Install git hooks"
run = """
#!/usr/bin/env bash
mkdir -p .git/hooks
cat > .git/hooks/pre-commit << 'EOF'
#!/bin/sh
mise run ci
EOF
chmod +x .git/hooks/pre-commit
echo "✅ Git hooks installed"
"""
run_windows = """
if not exist .git\\hooks mkdir .git\\hooks
echo mise run ci > .git\\hooks\\pre-commit
echo ✅ Git hooks installed
"""
